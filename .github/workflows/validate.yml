name: Validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q yamllint
          yamllint -d "{extends: default, rules: {line-length: disable}}" build-order-xfce.yml conf/distributions .github/workflows/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tests/ is included as well as scripts/: the shell test suite is code
      # too, and it was a bare `! grep -q` in there (SC2251) that silently
      # disabled an assertion.
      - name: shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck && shellcheck scripts/*.sh tests/*.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No install step: the suite stubs reprepro, curl, podman and friends
      # into a fixture PATH, so it needs nothing but bash and runs in about a
      # second.
      - name: Run the build-chain test suite
        run: bash tests/test-build-chain.sh

  build-order-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate build-order-xfce.yml resolves every package path
        run: |
          python3 - <<'PYEOF'
          import yaml, pathlib, sys
          bo = yaml.safe_load(open("build-order-xfce.yml"))
          missing = []
          for tier in bo["tiers"]:
              for pkg in tier["packages"]:
                  p = pathlib.Path(pkg["path"])
                  if not (p / "debian" / "control").exists():
                      missing.append(str(p))
                  if not (p / "upstream-source.txt").exists():
                      missing.append(str(p) + " (no upstream-source.txt)")
          if missing:
              print("Missing packaging for:", missing)
              sys.exit(1)
          print(f"All {sum(len(t['packages']) for t in bo['tiers'])} package(s) resolve.")
          PYEOF
