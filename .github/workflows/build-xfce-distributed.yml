name: XFCE Wayland Distributed Build and Publish (Debian)
on:
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild even if package exists in repo
        type: boolean
        default: false

env:
  DISTRIBUTION: resolute
  R2_BUCKET: bluefin

jobs:
  build-builder-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build builder image
        run: podman build -t localhost/debian-copr-builder:resolute -f builder/Containerfile builder/
      - name: Save image
        run: podman save -o /tmp/builder-image.tar localhost/debian-copr-builder:resolute
      - uses: actions/upload-artifact@v7
        with:
          name: builder-image
          path: /tmp/builder-image.tar
          retention-days: 1

  build-xfwl4-compositor:
    needs: build-builder-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {name: builder-image, path: /tmp}
      - run: podman load -i /tmp/builder-image.tar
      - name: Install host dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q podman reprepro gnupg
      - name: Import GPG key (no-op placeholder; real key imported at publish)
        run: mkdir -p local-repo
      - name: Build xfwl4
        run: |
          touch .build-marker
          ARGS=(--package src/xfce-wayland/xfwl4)
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          ./scripts/build-chain.sh "${ARGS[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: repo-xfwl4-compositor
          path: local-repo
          retention-days: 1

  publish:
    needs: build-xfwl4-compositor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        env:
          # Pinned + checksum-verified rather than `curl https://rclone.org/install.sh | sudo bash`.
          # This job imports GPG_PRIVATE_KEY and publishes to R2 in later steps, so running an
          # unpinned installer as root here would hand any compromise of that script full access
          # to the signing key and bucket credentials.
          # Checksum from https://github.com/rclone/rclone/releases/download/v1.75.0/SHA256SUMS
          #
          # NOT named RCLONE_VERSION: rclone maps every RCLONE_* environment variable onto the
          # matching CLI flag, so RCLONE_VERSION is read as --version and makes every rclone
          # invocation in scope abort with a ParseBool error.
          PINNED_RCLONE_VERSION: v1.75.0
          PINNED_RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q reprepro gnupg unzip
          curl -fsSL -o /tmp/rclone.zip \
            "https://github.com/rclone/rclone/releases/download/${PINNED_RCLONE_VERSION}/rclone-${PINNED_RCLONE_VERSION}-linux-amd64.zip"
          echo "${PINNED_RCLONE_SHA256}  /tmp/rclone.zip" | sha256sum -c -
          unzip -q -o /tmp/rclone.zip -d /tmp/rclone
          sudo install -m 0755 "/tmp/rclone/rclone-${PINNED_RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
      - uses: actions/download-artifact@v8
        with: {name: repo-xfwl4-compositor, path: local-repo}
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Re-sign repo with real key
        run: |
          echo "SignWith: ${{ steps.import-gpg.outputs.fingerprint }}" # placeholder; conf/distributions already pins SignWith: default
          reprepro -b local-repo --confdir "$(pwd)/conf" export "${DISTRIBUTION}"
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF2
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF2
      - name: Publish to R2
        run: |
          rclone sync local-repo/ "r2:${R2_BUCKET}/deb/26.04-resolute/"
          rclone copyto public.gpg "r2:${R2_BUCKET}/deb/public.gpg"
